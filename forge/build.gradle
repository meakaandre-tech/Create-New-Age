import dev.ithundxr.silk.ChangelogText

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    compileOnly(project(":common"))
    forge("net.neoforged:forge:${rootProject.forgeVersion}")

    modImplementation("com.simibubi.create:create-${rootProject.minecraftVersion}:${rootProject.createVersion}:slim") { transitive = false }
    modApi("com.tterrag.registrate:Registrate:${rootProject.registrateVersion}")
    compileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraftVersion}:${flywheelVersion}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraftVersion}:${flywheelVersion}")
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraftVersion}:${ponderVersion}")

    modRuntimeOnly("maven.modrinth:createaddition:forge-1.20.1-1.3.")
    modRuntimeOnly("appeng:appliedenergistics2-forge:${ae2Version}")
    modRuntimeOnly("maven.modrinth:guideme:20.1.14")

    compileOnly("io.github.llamalad7:mixinextras-common:0.4.1")
    annotationProcessor(implementation(include("io.github.llamalad7:mixinextras-forge:0.4.1")))

    compileOnly("cc.tweaked:cc-tweaked-${rootProject.minecraftVersion}-core-api:${cctVersion}")
    modCompileOnly("cc.tweaked:cc-tweaked-${rootProject.minecraftVersion}-forge-api:${cctVersion}")
    modRuntimeOnly("cc.tweaked:cc-tweaked-${rootProject.minecraftVersion}-forge:${cctVersion}")
    forgeRuntimeLibrary("cc.tweaked:cobalt:0.9.7")
}

processResources {
    from(project(":common").sourceSets.main.resources)
    var replaceProperties = [
        "version": rootProject.version.replaceAll("\\+.*-mc", "\\+mc"),
        "minecraftVersion": rootProject.minecraftVersion,
        "forgeVersionRange": project.forgeVersionRange,
        "eslVersion": rootProject.eslVersion,
        "createVersion": rootProject.createVersion.replaceAll("-[0-9]*", ""),
        "objLoader": project.objLoader
    ]

    inputs.properties(replaceProperties)
    filesMatching(["META-INF/mods.toml", "assets/**/*.json"]) {
        expand(replaceProperties)
    }
}

compileJava {
    source(project(":common").sourceSets.main.allSource)
}

var modId = rootProject.modId

loom {
    forge {
        convertAccessWideners = true
        mixinConfigs(
                "create_new_age-common.mixins.json",
                "create_new_age-forge.mixins.json",
                "create.mixins.json"
        )
        runs {
            client {
                property("mixin.env.remapRefMap", "true")
                property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")
            }
        }
    }
    
    runs {
        datagen {
            data()
            programArgs("--all", "--mod", "${modId}")
            programArgs("--output", file("src/generated/resources").absolutePath)
            programArgs("--existing", file("../common/src/main/resources").absolutePath)
        }
    }
}

// https://modmuss50.github.io/mod-publish-plugin/
publishMods {
    file = remapJar.archiveFile
    changelog = ChangelogText.getChangelogText(rootProject).toString()
    type = STABLE
    version = "$modVersion+mc$minecraftVersion"
    displayName = "$modVersion for Forge $minecraftVersion"
    modLoaders.add("forge")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "905861"
        clientRequired = true
        serverRequired = true
        requires("create")
        minecraftVersions.add(minecraftVersion)
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "FTeXqI9v"
        requires { // Requires Create
            id = "LNytGWDc"
        }
        minecraftVersions.add(minecraftVersion)
    }
}